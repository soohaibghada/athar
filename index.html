<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أثر</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ed;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    #dhikr {
      font-size: 25px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 25px;
      margin: 7px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    .main {
      background: #333;
      color: white;
    }

    .secondary {
      background: #e8e5dc;
      color: #333;
    }

    footer {
      margin-top: 35px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>أثر</h1>

    <div class="subtitle">
      اجعل لك ولمن تحب أثرًا طيبًا لا ينقطع 🤍
    </div>

    <div class="card">

      <div id="dhikr">
        سُبْحَانَ اللهِ وَبِحَمْدِهِ
      </div>

      <button class="main" onclick="countDhikr()">
        📿 استغفرتُ الله
      </button>

      <button class="secondary" onclick="changeDhikr()">
        🔄 ذكر آخر
      </button>

      <p>عدد التسبيحات: <span id="counter">0</span></p>

    </div>

    <footer>
      صدقة جارية عن من تحب 🤍
    </footer>

  </div>

  <script>

    let count = 0;

    const adhkar = [
      "سُبْحَانَ اللهِ وَبِحَمْدِهِ",
      "أَسْتَغْفِرُ اللهَ وَأَتُوبُ إِلَيْهِ",
      "سُبْحَانَ اللهِ، وَالْحَمْدُ لِلَّهِ",
      "لَا إِلٰهَ إِلَّا اللهُ",
      "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",
      "سُبْحَانَ اللهِ وَالْحَمْدُ لِلَّهِ وَاللهُ أَكْبَرُ"
    ];

    let current = 0;

    function countDhikr() {
      count++;
      document.getElementById("counter").textContent = count;
    }

    function changeDhikr() {
      current++;

      if (current >= adhkar.length) {
        current = 0;
      }

      document.getElementById("dhikr").textContent = adhkar[current];
    }

  </script>

</body>
</html>
